[project]
name = "jobpulse-ai"
version = "0.1.0"
description = "Enterprise-Grade Automated Job Search and Assisted Application Assistant"
authors = [{ name = "Priyanshu", email = "109512538+Priyanshu98156@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "apscheduler>=3.10.4",
    "plyer>=2.1.0",
    "keyring>=24.3.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "respx>=0.21.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]
