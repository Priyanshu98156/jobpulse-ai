<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Finding Assistant{% endblock %}</title>
    <!-- Tailwind CSS CDN with Typography & Forms plugins -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <a href="/dashboard" class="flex items-center space-x-3 group cursor-pointer focus:outline-none">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 group-hover:bg-indigo-700 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-200 transition-colors">
                        <i class="fa-solid fa-briefcase"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg text-slate-900 tracking-tight group-hover:text-indigo-600 transition-colors">JobPulse AI</span>
                        <span class="text-xs text-indigo-600 font-semibold ml-1.5 px-2 py-0.5 bg-indigo-50 rounded-full border border-indigo-100">Connector Engine</span>
                    </div>
                </a>
                
                <div class="flex items-center space-x-1 sm:space-x-4">
                    <a href="/dashboard" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active_page == 'dashboard' %}bg-indigo-50 text-indigo-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-layer-group mr-1.5"></i> Dashboard
                    </a>
                    <a href="/profile" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active_page == 'profile' %}bg-indigo-50 text-indigo-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-id-card mr-1.5"></i> Candidate Profile
                    </a>
                    <a href="/settings" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active_page == 'settings' %}bg-indigo-50 text-indigo-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-sliders mr-1.5"></i> Connectors & Config
                    </a>
                    <button onclick="triggerSync()" id="syncBtn" class="ml-2 inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm shadow-indigo-300 transition-all duration-150">
                        <i class="fa-solid fa-arrows-rotate mr-2" id="syncIcon"></i>
                        <span>Fetch Now</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        JobPulse AI Assistant &bull; Powered by Google Gemini &amp; Public ATS Connectors &bull; Running Locally
    </footer>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-slate-800');
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center space-x-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info')}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function triggerSync() {
            const btn = document.getElementById('syncBtn');
            const icon = document.getElementById('syncIcon');
            btn.disabled = true;
            btn.classList.add('opacity-75');
            icon.classList.add('fa-spin');
            showToast('Searching enabled connectors for matching jobs...', 'info');

            try {
                const res = await fetch('/api/sync', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    showToast(`Sync complete! Fetched ${data.total_fetched} jobs (${data.new_jobs_added} new).`, 'success');
                    setTimeout(() => window.location.reload(), 1200);
                } else {
                    showToast(data.message || 'Error syncing jobs.', 'error');
                }
            } catch (err) {
                showToast('Failed to reach server sync endpoint.', 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                icon.classList.remove('fa-spin');
            }
        }
    </script>
</body>
</html>
